
name: Build NOVA OS Game Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p build-src
          unzip -q NOVA_OS_Game_Hub_App.zip -d build-src

      - name: Build debug APK
        run: |
          cd build-src/NOVA_OS_Android_Project
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-Game-Hub-APK
          path: build-src/NOVA_OS_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
